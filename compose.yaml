name: chongban
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/backend/storage/chongban.db
      DEMO_MODE: "${DEMO_MODE:-true}"
      MODEL_PROVIDER: "${MODEL_PROVIDER:-compatible}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-flash}"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      DASHSCOPE_WORKSPACE_ID: "${DASHSCOPE_WORKSPACE_ID:-}"
      DASHSCOPE_BASE_URL: "${DASHSCOPE_BASE_URL:-}"
      DASHSCOPE_MODEL: "${DASHSCOPE_MODEL:-qwen3.7-flash}"
      MODEL_API_KEY: "${MODEL_API_KEY:-}"
      MODEL_BASE_URL: "${MODEL_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      MODEL_NAME: "${MODEL_NAME:-qwen3.7-flash}"
      SECRET_KEY: "${SECRET_KEY:-}"
    volumes:
      - pet_data:/app/backend/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  pet_data:
